{% extends "base.html" %}

{% block title %}{{ title | default('Error') }}{% endblock %}

{% block content %}
<div class="error-container" style="display: flex; align-items: center; justify-content: center; min-height: 60vh;">
  <div style="text-align: center;">
    <h1 style="font-size: 2.5rem; margin-bottom: 1rem; color: #dc2626;">{{ title | default('Error') }}</h1>
    <p style="font-size: 1.1rem; color: #666; margin-bottom: 2rem;">{{ message | default('Something went wrong') }}</p>
    <a href="/" style="display: inline-block; padding: 0.75rem 1.5rem; background-color: #0066cc; color: white; text-decoration: none; border-radius: 0.375rem;">
      Return Home
    </a>
  </div>
</div>
{% endblock %}
